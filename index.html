<!doctype html><html lang="it"><head>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243a"><title>Metronomo RCP — 30 compressioni</title><style>:root{font-family:system-ui,-apple-system,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1727;color:#f5f8ff;min-height:100svh;display:grid;place-items:center;padding:18px}.app{width:min(100%,480px);background:#14283e;border:1px solid #36506b;border-radius:24px;padding:25px 20px;text-align:center;box-shadow:0 12px 35px #0004}h1{font-size:1.35rem;margin:0 0 8px}p{color:#b9cce0;font-size:.9rem}.bpm{font-size:3.5rem;font-weight:800;margin:10px 0 0}input[type=range]{width:100%;accent-color:#66d3e7}.range{display:flex;justify-content:space-between;color:#b9cce0;font-size:.8rem}.circle{width:175px;height:175px;border-radius:50%;border:6px solid #66d3e7;margin:24px auto 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#18394d;transition:transform .09s,background .09s}.circle.hit{transform:scale(1.09);background:#2b8e9d}.num{font-size:4.5rem;line-height:1;font-weight:800}.subtitle{font-size:.85rem;color:#d7ebf2;margin-top:7px}.status{min-height:46px;font-weight:600;margin:12px 0}.buttons{display:flex;gap:10px}button{font:inherit;font-weight:700;border:0;border-radius:13px;padding:15px 14px;cursor:pointer}#start{flex:1;background:#69d5e7;color:#0a2332}#stop{background:#314b62;color:#fff}button:disabled{opacity:.4;cursor:default}.options{display:flex;justify-content:center;gap:12px;margin:17px 0;align-items:center}.small{font-size:.78rem;color:#b9cce0;line-height:1.5}.warning{border-top:1px solid #38566d;margin-top:20px;padding-top:15px}</style></head><body><main class="app"><h1>❤️ Metronomo RCP</h1><p>Allenamento · serie di 30 compressioni</p><div class="bpm"><span id="bpm">110</span> <span style="font-size:1rem;font-weight:400">bip/min</span></div><input type="range" id="speed" min="100" max="120" step="5" value="110" aria-label="Frequenza"><div class="range"><span>100</span><span>110</span><span>120</span></div><div class="circle" id="circle"><div class="num" id="number">30</div><div class="subtitle" id="sub">compressioni</div></div><div class="status" id="status" role="status" aria-live="polite">Pronto per iniziare</div><div class="buttons"><button id="start">▶ AVVIA</button><button id="stop" disabled>FERMA</button></div><label class="options"><input type="checkbox" id="sound" checked> Segnale acustico</label><p class="small warning">10 secondi di preparazione · 30 bip · arresto automatico.<br>Per esercitazioni su manichino. Non sostituisce la formazione RCP né le indicazioni del 112.</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),bpm=$('bpm'),speed=$('speed'),circle=$('circle'),number=$('number'),sub=$('sub'),status=$('status'),start=$('start'),stop=$('stop'),sound=$('sound');let phase='idle',count=0,interval=null,timeout=null,ctx=null,deadline=0;
function tone(freq=850,duration=.085){if(!sound.checked)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+duration)}catch(e){}}
function clearTimers(){clearInterval(interval);clearTimeout(timeout);interval=null;timeout=null}function hit(){circle.classList.add('hit');setTimeout(()=>circle.classList.remove('hit'),125)}
function idle(message='Pronto per iniziare'){clearTimers();phase='idle';start.disabled=false;stop.disabled=true;start.textContent='▶ AVVIA';number.textContent='30';sub.textContent='compressioni';status.textContent=message;circle.classList.remove('hit')}
function finish(){clearTimers();phase='done';number.textContent='30';sub.textContent='su 30';status.textContent='✓ Serie completata';start.disabled=false;start.textContent='↻ RIPETI';stop.disabled=true;circle.classList.remove('hit')}
function compress(){if(phase!=='running')return;count++;number.textContent=count;sub.textContent='su 30';status.textContent='Compressione '+count+' di 30';hit();tone();if(count>=30){finish()}}
function startBeats(){clearTimers();phase='running';count=0;status.textContent='Esegui le compressioni';deadline=performance.now();compress();if(phase!=='running')return;const period=60000/Number(speed.value);deadline+=period;interval=setInterval(()=>{const now=performance.now();if(now>=deadline-10){compress();deadline+=period;if(deadline<now)deadline=now+period}},15)}
function begin(){if(phase==='countdown'||phase==='running')return;clearTimers();try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}phase='countdown';start.disabled=true;stop.disabled=false;let remaining=10;number.textContent=remaining;sub.textContent='secondi';status.textContent='Posiziona le mani';tone(550,.06);interval=setInterval(()=>{remaining--;if(remaining===0){startBeats()}else{number.textContent=remaining;tone(550,.06)}},1000)}
start.addEventListener('click',begin);stop.addEventListener('click',()=>idle('Interrotto · pronto per ricominciare'));speed.addEventListener('input',()=>{bpm.textContent=speed.value;if(phase==='running')deadline=performance.now()+60000/Number(speed.value)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(phase==='running'||phase==='countdown'))idle('In pausa: app non visibile')});window.addEventListener('pagehide',()=>{clearTimers()});
})();</script></body></html>
